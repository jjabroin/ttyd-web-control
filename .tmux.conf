# UTF-8 및 256컬러 지원
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 마우스 모드 ON
set -g mouse on

# 스크롤 시 기본 5줄 건너뛰기 대신 정확히 1줄씩 스크롤하도록 바인딩
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# 스크롤 히스토리 대폭 확장 (10,000줄)
set -g history-limit 10000

# 상태 표시줄 간소화 및 다크 테마
set -g status-style bg='#1a1a1a',fg='#888888'
set -g status-left '#[fg=#4af626,bold][Antigravity] '
set -g status-left-length 20
set -g status-right '#[fg=#aaaaaa]%H:%M '
set -g status-interval 60

# 창 번호 1부터 시작
set -g base-index 1
setw -g pane-base-index 1
